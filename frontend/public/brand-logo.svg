<svg xmlns="http://www.w3.org/2000/svg" width="280" height="52" viewBox="0 0 280 52">
  <defs>
    <linearGradient id="brandGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00a8cc" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <filter id="logoShadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000000" flood-opacity="0.08" />
    </filter>
  </defs>

  <!-- Clean White Badge Container -->
  <rect x="2" y="2" width="276" height="48" rx="10" fill="#ffffff" filter="url(#logoShadow)" stroke="#e2e8f0" stroke-width="1.5" />

  <!-- Academic Icon Badge -->
  <g transform="translate(12, 10)">
    <rect x="0" y="0" width="32" height="32" rx="8" fill="url(#brandGrad)" />
    <!-- Graduation Cap -->
    <path d="M16 8 L6 14 L16 20 L26 14 Z" fill="#ffffff" />
    <path d="M10 17.5 V22.5 C10 24.5 13 26 16 26 C19 26 22 24.5 22 22.5 V17.5" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" />
    <path d="M24 15 V22" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" />
  </g>

  <!-- Single Text Element with TSPANS for zero overlap -->
  <text x="52" y="33" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="22" font-weight="800">
    <tspan fill="#0f172a">cits</tspan>
    <tspan fill="#00a8cc" font-size="24" font-weight="900" font-style="italic">A</tspan>
    <tspan fill="#0f172a">dmission</tspan>
    <tspan fill="#0284c7" font-size="14" font-weight="700">.com</tspan>
  </text>
</svg>
